<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Pets — aperçu 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #eef3e6; font-family: system-ui, sans-serif; }
  #v { position: fixed; inset: 0; }
  .bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; }
  button { border: 0; border-radius: 999px; padding: 8px 14px; background: #2f5d3a; color: #fff; font-weight: 600; cursor: pointer; }
  button[aria-pressed="false"] { background: #9db59f; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="v"></div>
<div class="bar">
  <button data-variant="Shiba/Normal" aria-pressed="true">Shiba</button>
  <button data-variant="Shiba/Golden" aria-pressed="false">Shiba Golden</button>
  <button data-variant="Dog/Normal" aria-pressed="false">Chien</button>
  <button data-variant="Dog/Golden" aria-pressed="false">Chien Golden</button>
  <button data-variant="Cat/Normal" aria-pressed="false">Chat</button>
  <button data-variant="Cat/Golden" aria-pressed="false">Chat Golden</button>
  <button data-variant="Hamster/Normal" aria-pressed="false">Hamster</button>
  <button data-variant="Hamster/Golden" aria-pressed="false">Hamster Golden</button>
  <button data-variant="lineup" aria-pressed="false">Côte à côte</button>
  <button data-variant="lineupBig" aria-pressed="false">Shiba BIG + chien + chat + hamster</button>
  <button id="outline" aria-pressed="true">Contour</button>
</div>
<script type="module">
  // Lancer depuis ce dossier : python3 -m http.server  puis ouvrir /viewer.html
  import { createViewer } from "./viewer.js";
  const data = await (await fetch("./pet_data.json")).json();
  const viewer = await createViewer(document.getElementById("v"), data, { variant: "Shiba/Normal" });
  window.viewer = viewer;
  for (const b of document.querySelectorAll("[data-variant]")) {
    b.onclick = () => {
      if (b.dataset.variant === "lineup") {
        viewer.setLineup([{ key: "Shiba/Normal", x: 2.3 }, { key: "Dog/Normal", x: -2.1 }]);
        viewer.setView([-1.5, 5, -16], [0, 1.45, 0]);
      } else if (b.dataset.variant === "lineupBig") {
        viewer.setLineup([{ key: "Shiba/Normal", x: 3.6, scale: 2 }, { key: "Dog/Normal", x: -1.2 }, { key: "Cat/Normal", x: -5.0 }, { key: "Hamster/Normal", x: -8.3 }]);
        viewer.setView([-5, 8.2, -27.5], [-1.7, 2.2, 0]);
      } else {
        viewer.setVariant(b.dataset.variant);
      }
      document.querySelectorAll("[data-variant]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    };
  }
  const ob = document.getElementById("outline");
  ob.onclick = () => {
    const on = ob.getAttribute("aria-pressed") !== "true";
    ob.setAttribute("aria-pressed", String(on));
    viewer.setOutline(on);
  };
</script>
</body>
</html>
